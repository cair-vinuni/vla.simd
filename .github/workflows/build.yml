name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One tree, three platforms. All with -Werror, all asserting the vector
  # backend was picked over the scalar fallback.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     build_type: Release }
          - { os: ubuntu-24.04,     build_type: Debug }
          - { os: ubuntu-24.04,     build_type: Release, cxx: clang++ }
          - { os: ubuntu-24.04-arm, build_type: Release }
          - { os: ubuntu-24.04-arm, build_type: Debug }
          - { os: ubuntu-24.04-arm, build_type: Release, cxx: g++-12 }
          # cmake_extra is empty for every row but this one. The macOS runners are
          # virtualized, and there AppleClang resolves -mcpu=native to a CPU
          # without dotprod, so gemm_i8.cpp's vdotq_s32 kernels fail to compile.
          # A real Mac detects its own part correctly, so CMakeLists keeps
          # native as the default and only CI pins the floor.
          - { os: macos-latest,     build_type: Release, cmake_extra: -DVLA_APPLE_MCPU=apple-m1 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'macOS'
        run: brew install libomp
      - if: matrix.cxx == 'clang++'
        run: sudo apt-get install -y libomp-dev
      - name: configure
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                ${{ matrix.cmake_extra }}
      - run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)
      # The ISA flags once lived in CMAKE_CXX_FLAGS_RELEASE, so other build types
      # compiled the HAL without them and src/hal/arch.h fell back to the scalar
      # kernels. Assert they reach the actual compile line, in every build type.
      - name: the ISA flags reach the HAL compile line
        run: |
          python3 - <<'EOF'
          import json, platform, sys
          db = json.load(open("build/compile_commands.json"))
          tu = next(e for e in db if e["file"].endswith("src/hal/common/gemm.cpp"))
          cmd = tu.get("command") or " ".join(tu["arguments"])
          mach = platform.machine()
          want = ["-mavx2", "-mfma"] if mach == "x86_64" else (
              ["-mcpu=apple-m1"] if sys.platform == "darwin" else ["-march=armv8-a+simd"])
          want.append("-fopenmp")
          missing = [f for f in want if f not in cmd]
          if missing:
              sys.exit(f"{mach}: {missing} absent from the HAL compile line:\n{cmd}")
          print(f"{mach}: {want} present")
          EOF
      - run: ctest --test-dir build --output-on-failure
      - if: runner.arch == 'X64'
        run: TCPU_ZEN=1 ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DVLA_SANITIZE=address,undefined -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build build -j$(nproc)
      - run: ctest --test-dir build --output-on-failure

  # Installs, exports, and links from an out-of-tree consumer.
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset release && cmake --build --preset release -j$(nproc)
      - run: cmake --install build --prefix "$PWD/stage"
      - name: find_package + link
        run: |
          mkdir -p /tmp/c && cd /tmp/c
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer C)
          find_package(vla_simd REQUIRED)
          add_executable(use use.c)
          target_link_libraries(use PRIVATE vla::vla_simd_smolvla)
          EOF
          cat > use.c <<'EOF'
          #include <vla_simd.h>
          int main(void){ return vla_abi_version() == VLA_ABI_VERSION ? 0 : 1; }
          EOF
          cmake -S . -B b -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/stage"
          cmake --build b
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/stage/lib" ./b/use
      # vla_abi_version lived in act_capi.cpp only, so the other libraries
      # did not export the symbol their own header declares.
      - name: every library exports the ABI symbol
        run: |
          for l in act smolvla octo turbovla impact diffusion; do
            nm -D --defined-only "stage/lib/libvla_simd_$l.so" | grep -q vla_abi_version \
              || { echo "libvla_simd_$l.so is missing vla_abi_version"; exit 1; }
          done
