[project]
name = "vla-simd-tooling"
version = "0.1.0"
description = "Python tooling for vla.simd: checkpoint converters and the policy server."
readme = "README.md"
# Floor only. The extras disagree on the ceiling: serve/lerobot need >=3.12,
# octo stops resolving at 3.12. Per-extra ranges are in the README table.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Empty on purpose: a base dependency applies to every extra, and octo pins
# numpy 1.24.3 against everyone else's >=2.1. Each extra declares its own.
dependencies = []

# One venv per extra, never combined: uv pip install -e '.[<name>]'
[project.optional-dependencies]

# serve/policy_server.py. Python >=3.12.
#
# lerobot is here for the wire types only: the payloads are pickled lerobot
# dataclasses. No policy is built, inference is libvla_simd_<model>.so.
#
# protobuf is absent from lerobot's own deps (`No module named 'google'`). On
# aarch64 lerobot resolves torch to the CUDA build (~3.5 GB of nvidia-* wheels);
# reinstall CPU torch after, not before, since lerobot overwrites it:
#   uv pip install --index-url https://download.pytorch.org/whl/cpu torch
serve = [
    "numpy>=2.1,<3",
    "lerobot>=0.6.1,<0.7",   # 0.6.0 fixes CVE-2026-25874
    "grpcio>=1.68,<2",
    "protobuf>=5.29,<8",
    "torch>=2.8,<3",
]

# Torch-free convert path
numpy = [
    "numpy>=2.1,<3",
    "huggingface_hub>=1.0,<2",   # convert_tokenizer.py. safetensors is NOT needed:
                                 # the converter parses the header itself
]

# ACT, IMPACT, Diffusion, and the torch SmolVLA/Octo paths.
lerobot = [
    "lerobot[smolvla]>=0.6.1,<0.7",   # [smolvla] is what pulls transformers, which
                                      # convert_lerobot_ckpt.py needs
    "numpy>=2.1,<3",
    "safetensors>=0.6,<1",            # direct import in convert_impact.py and
                                      # convert_diffusion.py
]

# TurboVLA
turbovla = [
    "numpy>=2.1,<3",
    "torch>=2.8,<3",
    "transformers>=4.57,<5",
]

# Jax Octo
octo = [
    "jax==0.4.20",                 # what octo-small-1.5 was released against
    "flax==0.7.5",                 # jax 0.4.20-compatible
    "tensorflow-cpu==2.15.0",      # only for tf.io.gfile, which orbax reads through
    "distrax==0.1.5",              # octo's action head imports it
    "chex==0.1.85",                # distrax/optax dependency, pinned with them
    "optax==0.1.5",
    "tensorflow-probability==0.23.0",
    "numpy==1.24.3",               # jax 0.4.20 predates the numpy 2 ABI
    "ml_dtypes==0.2.0",            # must match jax 0.4.20's expectation
    "scipy==1.11.4",               # must stay <1.13 for jax 0.4.20
    "einops==0.7.0",               # last release before the 0.8 API churn
    "transformers==4.36.2",        # the T5 tokenizer octo's ids were produced with
    "sentencepiece==0.1.99",       # what transformers 4.36 was released against
    "huggingface_hub==0.20.3",     # transformers 4.36 predates the hub 1.0 rename
]

# Metadata-only: the code in tools/ and serve/ is run by path, never imported.
# This exists to carry the extras, and installs under plain pip as well as uv.
#
# `uv lock` would resolve every extra together and bake in the 0.3.3 backsolve
# above; it would need [tool.uv] conflicts for numpy/turbovla and
# lerobot/turbovla.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []             # installs the pinned deps, no package
