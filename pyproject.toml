[project]
name = "vla-simd-tooling"
version = "0.1.0"
description = "Python tooling for vla.simd: checkpoint converters and the policy server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=2.1,<3"]

# The two requirements files stay the canonical pins; these groups mirror them.
[project.optional-dependencies]
# tools/smolvla/convert_hf_safetensors.py. No torch: the whole SmolVLA convert
# path is numpy and ctypes.
convert = [
    "numpy>=2.1,<3",
    "safetensors>=0.6,<1",
    "huggingface_hub>=1.0,<2",
]
# serve/policy_server.py. See the security note in serve/requirements.txt.
serve = [
    "numpy>=2.1,<3",
    "lerobot>=0.6.1,<0.7",
    "grpcio>=1.68,<2",
    "protobuf>=5.29,<8",
    "torch>=2.8,<3",
]

# Deps-only project: the code lives in tools/ and serve/, not an importable package.
[tool.uv]
package = false
